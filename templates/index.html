{% extends 'base.html' %}{% block content %}<h1>Coin Race</h1><p>Move with arrow keys or WASD. Collect gold coins. Share a room name to play together.</p><form id="join" class="card"><div class="grid"><div><label for="name">Name</label><input id="name" maxlength="20" value="Player" required></div><div><label for="room">Room</label><input id="room" value="lobby" pattern="[a-zA-Z0-9_-]{1,30}" required></div></div><p><button>Join room</button> <button type="button" id="leave" class="secondary">Leave</button></p></form><p id="status" role="status">Ready to play.</p><div class="grid"><section class="card"><canvas id="board" width="500" height="500" aria-label="Coin collecting game board"></canvas><div class="row"><button data-direction="up">↑</button><button data-direction="left">←</button><button data-direction="down">↓</button><button data-direction="right">→</button></div></section><section class="card"><h2>Leaderboard</h2><ol id="scores"></ol></section></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='game.js') }}"></script>{% endblock %}
